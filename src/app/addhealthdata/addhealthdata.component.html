<form [formGroup]="myForm" (ngSubmit)="onSubmit()">
  <div class="container">
    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="txtText"
          placeholder=""
          name="txtText"
          formControlName="txtText"
          title="{{ tooltips.txtText }}"
          [(ngModel)]="addData.topic"
          list="symptomList"
          (change)="onTextSelection($event)"
          required
        />
        <datalist id="symptomList">
          <option value="Associated symptoms"></option>
          <option value="Other"></option>
          <option value="Others"></option>
          <option value="Other [describe]"></option>
        </datalist>
        <label for="txtText">Text <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtText" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
        <p class="text-danger" *ngIf="myForm.get('txtText')?.invalid && myForm.get('txtText')?.touched">Text cannot be blank</p>
      </div>
    </div>
    <div class="d-flex justify-content-between align-items-center">
      <h6 class="mb-0">Node Rules</h6>
      <button
        type="button"
        class="btn btn-primary popup-save-btn btn-sm"
        (click)="resetNodeRules()"
        title="Reset all Node Rules fields"
      >
        Reset
      </button>
    </div>
    <hr />
    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <select
          name="txtInputType"
          id="txtInputType"
          class="form-select"
          formControlName="txtInputType"
          title="{{ tooltips.txtInputType }}"
          [(ngModel)]="addData.input_type"
          placeholder="Input Type"
        >
          <option value="">-- Select --</option>
          <option value="text">text</option>
          <option value="number">number</option>
          <option value="decimal">decimal</option>
          <option value="date">date</option>
          <option value="duration">duration</option>
          <option value="camera">camera</option>
          <option value="frequency">frequency</option>
          <option value="range">range</option>
        </select>
        <label for="txtInputType">Input Type <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtInputType" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
      <div class="col-sm form-floating mb-3">
        <select
          name="txtGender"
          id="txtGender"
          class="form-select"
          formControlName="txtGender"
          title="{{ tooltips.txtGender }}"
          [(ngModel)]="addData.gender"
        >
          <option value="">-- Select --</option>
          <option value="1">male</option>
          <option value="0">female</option>
          <option value="2">other</option>
        </select>
        <label for="txtgender">Gender <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtGender" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-sm mb-3">
        <label class="form-label">Age Min <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtAgeMin" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
        <div class="row g-2">
          <div class="col-4 form-floating mb-3">
            <select
              class="form-select"
              id="txtAgeMinYear"
              name="txtAgeMinYear"
              formControlName="txtAgeMinYear"
              placeholder="Years"
              [(ngModel)]="ageMinYear"
              (ngModelChange)="onAgeMinYearChange()"
            >
              <option [ngValue]="null">-- Select --</option>
              <option *ngFor="let y of yearOptions" [ngValue]="y">{{ y }}</option>
            </select>
            <label for="txtAgeMinYear">Years</label>
          </div>
          <div class="col-4 form-floating mb-3">
            <select
              class="form-select"
              id="txtAgeMinMonths"
              name="txtAgeMinMonths"
              formControlName="txtAgeMinMonths"
              placeholder="Months"
              [(ngModel)]="ageMinMonths"
              (ngModelChange)="onAgeMinMonthChange()"
            >
              <option [ngValue]="null">-- Select --</option>
              <option *ngFor="let m of monthOptions" [ngValue]="m">{{ m }}</option>
            </select>
            <label for="txtAgeMinMonths">Months</label>
          </div>
          <div class="col-4 form-floating mb-3">
            <select
              class="form-select"
              id="txtAgeMinDays"
              name="txtAgeMinDays"
              formControlName="txtAgeMinDays"
              placeholder="Days"
              [(ngModel)]="ageMinDays"
              (ngModelChange)="onAgeMinDayChange()"
            >
              <option [ngValue]="null">-- Select --</option>
              <option *ngFor="let d of ageMinDayOptions" [ngValue]="d">{{ d }}</option>
            </select>
            <label for="txtAgeMinDays">Days</label>
          </div>
        </div>
      </div>
      <div class="col-sm mb-3">
        <label class="form-label">Age Max <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtAgeMax" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
        <div class="row g-2">
          <div class="col-4 form-floating mb-3">
            <select
              class="form-select"
              id="txtAgeMaxYear"
              name="txtAgeMaxYear"
              formControlName="txtAgeMaxYear"
              placeholder="Years"
              [(ngModel)]="ageMaxYear"
              (ngModelChange)="onAgeMaxYearChange()"
            >
              <option [ngValue]="null">-- Select --</option>
              <option *ngFor="let y of yearOptions" [ngValue]="y">{{ y }}</option>
            </select>
            <label for="txtAgeMaxYear">Years</label>
          </div>
          <div class="col-4 form-floating mb-3">
            <select
              class="form-select"
              id="txtAgeMaxMonths"
              name="txtAgeMaxMonths"
              formControlName="txtAgeMaxMonths"
              placeholder="Months"
              [(ngModel)]="ageMaxMonths"
              (ngModelChange)="onAgeMaxMonthChange()"
            >
              <option [ngValue]="null">-- Select --</option>
              <option *ngFor="let m of monthOptions" [ngValue]="m">{{ m }}</option>
            </select>
            <label for="txtAgeMaxMonths">Months</label>
          </div>
          <div class="col-4 form-floating mb-3">
            <select
              class="form-select"
              id="txtAgeMaxDays"
              name="txtAgeMaxDays"
              formControlName="txtAgeMaxDays"
              placeholder="Days"
              [(ngModel)]="ageMaxDays"
              (ngModelChange)="onAgeMaxDayChange()"
            >
              <option [ngValue]="null">-- Select --</option>
              <option *ngFor="let d of ageMaxDayOptions" [ngValue]="d">{{ d }}</option>
            </select>
            <label for="txtAgeMaxDays">Days</label>
          </div>
        </div>
        <p class="text-danger" *ngIf="myForm.hasError('invalidDateRange')">
          Max age must be greater than Min age
        </p>
      </div>
    </div>

    <div class="row form-floating mb-3" *ngIf="addData.input_type === 'range'">
      <div class="col-sm form-floating mb-3">
        <input
          type="number"
          class="form-control"
          id="txtRangeMin"
          placeholder=""
          name="txtRangeMin"
          formControlName="txtRangeMin"
          title="{{ tooltips.txtRangeMin }}"
          [(ngModel)]="addData.range_min"
        />
        <label for="txtRangeMin">Range Min <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtRangeMin" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
      <div class="col-sm form-floating mb-3">
        <input
          type="number"
          class="form-control"
          id="txtRangeMax"
          placeholder=""
          name="txtRangeMax"
          formControlName="txtRangeMax"
          title="{{ tooltips.txtRangeMax }}"
          [(ngModel)]="addData.range_max"
        />
        <label for="txtRangeMax">Range Max <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtRangeMax" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
        <p class="text-danger" *ngIf="myForm.hasError('invalidRangeOrder')">
          Max range must be greater than Min range
        </p>
      </div>
    </div>

    <div class="row form-floating mb-3" *ngIf="addData.input_type === 'camera'">
      <div class="col-sm form-floating mb-3">
        <select
          name="ddIsExclusive"
          id="ddIsExclusive"
          class="form-select"
          formControlName="ddIsExclusive"
          title="{{ tooltips.ddIsExclusive }}"
          [(ngModel)]="addData.is_exclusive"
          placeholder="Is Exclusive (Camera)"
        >
          <option [ngValue]="null">-- Select --</option>
          <option [ngValue]="true">true</option>
          <option [ngValue]="false">false</option>
        </select>
        <label for="ddIsExclusive">Is Exclusive (Camera) <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.ddIsExclusive" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>

    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <select
          name="ddisRequired"
          id="ddisRequired"
          class="form-select"
          formControlName="ddisRequired"
          title="{{ tooltips.ddisRequired }}"
          [(ngModel)]="addData.isRequired"
          placeholder="Is Required"
        >
          <option [ngValue]="null">-- Select --</option>
          <option [ngValue]="true">true</option>
          <option [ngValue]="false">false</option>
        </select>
        <label for="ddisRequired">Is this question Required? <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.ddisRequired" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
      <div class="col-sm form-floating mb-3">
        <select
          name="ddMultiChoice"
          id="ddMultiChoice"
          class="form-select"
          formControlName="ddMultiChoice"
          title="{{ tooltips.ddMultiChoice }}"
          [(ngModel)]="addData.multi_choice"
          placeholder="Multi Choice"
        >
          <option [ngValue]="null">-- Select --</option>
          <option [ngValue]="true">true</option>
          <option [ngValue]="false">false</option>
        </select>
        <label for="ddMultiChoice">Multi Choice <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.ddMultiChoice" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>
    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <select
          name="ddExcludeMultiChoice"
          id="ddExcludeMultiChoice"
          class="form-select"
          formControlName="ddExcludeMultiChoice"
          title="{{ tooltips.ddExcludeMultiChoice }}"
          [(ngModel)]="addData.exclude_from_multi_choice"
          placeholder="Exclude From Multi Choice"
        >
          <option [ngValue]="null">-- Select --</option>
          <option [ngValue]="true">true</option>
          <option [ngValue]="false">false</option>
        </select>
        <label for="ddExcludeMultiChoice">Exclude From Multi Choice <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.ddExcludeMultiChoice" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>

      <div class="col-sm form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="txtDisplay"
          placeholder=""
          name="txtDisplay"
          formControlName="txtDisplay"
          title="{{ tooltips.txtDisplay }}"
          [(ngModel)]="addData.display"
        />
        <label for="txtDisplay">Display (English) <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtDisplay" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>

    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <select
          name="havingNestedQuestion"
          id="havingNestedQuestion"
          class="form-select"
          formControlName="ddHavingNestedQuestion"
          title="{{ tooltips.ddHavingNestedQuestion }}"
          [(ngModel)]="addData.having_nested_question"
          placeholder="Having Nested Question"
        >
          <option [ngValue]="null">-- Select --</option>
          <option [ngValue]="true">true</option>
          <option [ngValue]="false">false</option>
        </select>
        <label for="ddHavingNestedQuestion">Having Nested Question <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.ddHavingNestedQuestion" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>

      <div class="col-sm form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="txtCompareDuplicateNode"
          placeholder=""
          name="txtCompareDuplicateNode"
          formControlName="txtCompareDuplicateNode"
          title="{{ tooltips.txtCompareDuplicateNode }}"
          [(ngModel)]="addData.compare_duplicate_node"
        />
        <label for="txtCompareDuplicateNode">Compare Duplicate Node <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtCompareDuplicateNode" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>

    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <select
          name="ddEnableExclusiveOption"
          id="ddEnableExclusiveOption"
          class="form-select"
          formControlName="ddEnableExclusiveOption"
          title="{{ tooltips.ddEnableExclusiveOption }}"
          [(ngModel)]="addData.enable_exclusive_option"
          placeholder="Enable Exclusive Option"
        >
          <option [ngValue]="null">-- Select --</option>
          <option [ngValue]="true">true</option>
          <option [ngValue]="false">false</option>
        </select>
        <label for="ddEnableExclusiveOption">Enable Exclusive Option <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.ddEnableExclusiveOption" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>

      <div class="col-sm form-floating mb-3">
        <select
          name="ddIsExclusiveOption"
          id="ddIsExclusiveOption"
          class="form-select"
          formControlName="ddIsExclusiveOption"
          title="{{ tooltips.ddIsExclusiveOption }}"
          [(ngModel)]="addData.is_exclusive_option"
          placeholder="Is Exclusive Option"
        >
          <option [ngValue]="null">-- Select --</option>
          <option [ngValue]="true">true</option>
          <option [ngValue]="false">false</option>
        </select>
        <label for="ddIsExclusiveOption">Is Exclusive Option <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.ddIsExclusiveOption" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating flex-grow-1">
            <input
              type="text"
              class="form-control"
              id="txtLanguage"
              placeholder=""
              name="txtLanguage"
              formControlName="txtLanguage"
              title="{{ tooltips.txtLanguage }}"
              [(ngModel)]="addData.language"
            />
            <label for="txtLanguage">Language to be shown in history note <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtLanguage" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
          </div>
          <button
            *ngIf="canSuggestLanguage"
            type="button"
            class="btn btn-outline-primary"
            (click)="suggestLanguage()"
            [disabled]="suggestingLanguage"
            title="Suggest clinical phrasing for the history note"
          >
            {{ suggestingLanguage ? "Suggesting..." : "Suggest" }}
          </button>
        </div>
        <small *ngIf="languageSuggestionReason" class="text-muted d-block mt-1">
          Suggested: {{ languageSuggestionReason }} Review before saving.
        </small>
        <small *ngIf="languageSuggestionError" class="text-danger d-block mt-1">
          {{ languageSuggestionError }}
        </small>
      </div>
    </div>
    <div class="row form-floating mb-3">
      <div class="col-6 form-floating mb-3">
        <input
          type="number"
          class="form-control"
          id="txtIndex"
          placeholder=""
          name="txtIndex"
          formControlName="txtIndex"
          title="{{ tooltips.txtIndex }}"
          [(ngModel)]="addData.index"
          min="0"
          (input)="onIndexChange($event)"
        />
        <label for="txtIndex">Index <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtIndex" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
        <p class="text-danger" *ngIf="indexError">
          Index must be a positive number
        </p>
      </div>
    </div>
    <h6>Triggers</h6>
    <hr />
    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <textarea
          class="form-control"
          id="txtPPE"
          placeholder=""
          name="txtPPE"
          formControlName="txtPPE"
          title="{{ tooltips.txtPPE }}"
          rows="3"
          [(ngModel)]="addData.perform_physical_exam"
        ></textarea>
        <label for="txtPPE">Perform Physical Exam <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtPPE" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
      <div class="col-sm form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="txtjobaidtype"
          placeholder=""
          name="txtjobaidtype"
          formControlName="txtjobaidtype"
          title="{{ tooltips.txtjobaidtype }}"
          [(ngModel)]="addData.job_aid_type"
        />
        <label for="txtjobaidtype">Job Aid Type <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtjobaidtype" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>

    <div class="row form-floating mb-3">
      <div class="col-6 form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="txtjobaidfile"
          placeholder=""
          name="txtjobaidfile"
          formControlName="txtjobaidfile"
          title="{{ tooltips.txtjobaidfile }}"
          [(ngModel)]="addData.job_aid_file"
        />
        <label for="txtjobaidfile">Job Aid File <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtjobaidfile" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>
    <h6>Alerts</h6>
    <hr />
    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <textarea
          class="form-control"
          id="txtpopup"
          placeholder=""
          name="txtpopup"
          formControlName="txtpopup"
          title="{{ tooltips.txtpopup }}"
          rows="3"
          [(ngModel)]="addData.pop_up"
        ></textarea>
        <label for="txtpopup">Pop Up <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtpopup" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
      <div class="col-sm form-floating mb-3">
        <textarea
          class="form-control"
          id="txtpopupor"
          placeholder=""
          name="txtpopupor"
          formControlName="txtpopupor"
          title="{{ tooltips.txtpopupor }}"
          rows="3"
          [(ngModel)]="addData.pop_up_or"
        ></textarea>
        <label for="txtpopupor">Pop Up (Odiya) <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtpopupor" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>
    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <textarea
          class="form-control"
          id="txtpopuphi"
          placeholder=""
          name="txtpopuphi"
          formControlName="txtpopuphi"
          title="{{ tooltips.txtpopuphi }}"
          rows="3"
          [(ngModel)]="addData.pop_up_hi"
        ></textarea>
        <label for="txtpopuphi">Pop Up (Hindi) <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtpopuphi" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
      <div class="col-sm form-floating mb-3">
        <textarea
          class="form-control"
          id="txtpopupmr"
          placeholder=""
          name="txtpopupmr"
          formControlName="txtpopupmr"
          title="{{ tooltips.txtpopupmr }}"
          rows="3"
          [(ngModel)]="addData.pop_up_mr"
        ></textarea>
        <label for="txtpopupmr">Pop Up (Marathi) <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtpopupmr" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>
    <h6>Translations</h6>
    <hr />
    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="txtDisplayHI"
          placeholder=""
          name="txtDisplayHI"
          formControlName="txtDisplayHI"
          title="{{ tooltips.txtDisplayHI }}"
          [(ngModel)]="addData.display_hi"
        />
        <label for="txtDisplayHI">Display (Hindi) <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtDisplayHI" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
      <div class="col-sm form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="txtDisplayOR"
          placeholder=""
          name="txtDisplayOR"
          formControlName="txtDisplayOR"
          title="{{ tooltips.txtDisplayOR }}"
          [(ngModel)]="addData.display_or"
        />
        <label for="txtDisplayOR">Display (Odiya) <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtDisplayOR" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>
    <div class="row form-floating mb-3">
      <div class="col-6 form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="txtDisplayMR"
          placeholder=""
          name="txtDisplayMR"
          formControlName="txtDisplayMR"
          title="{{ tooltips.txtDisplayMR }}"
          [(ngModel)]="addData.display_mr"
        />
        <label for="txtDisplayMR">Display (Marathi) <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtDisplayMR" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>
    <h6>Citation / उद्धरण</h6>
    <hr />
    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <textarea
          class="form-control"
          id="txtcitation"
          placeholder=""
          name="txtcitation"
          formControlName="txtcitation"
          title="{{ tooltips.txtcitation }}"
          rows="3"
          [(ngModel)]="addData.citation"
        >
        </textarea>
        <label for="txtcitation">Citation / उद्धरण <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtcitation" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
      <div class="col-sm form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="txtsnomed"
          placeholder=""
          name="txtsnomed"
          formControlName="txtsnomed"
          title="{{ tooltips.txtsnomed }}"
          [(ngModel)]="addData.snomed"
        />
        <label for="txtsnomed">Snomed <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtsnomed" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>

    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="txticd"
          placeholder=""
          name="txticd"
          formControlName="txticd"
          title="{{ tooltips.txticd }}"
          [(ngModel)]="addData.icd_11"
        />
        <label for="txticd">ICD-11 <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txticd" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
      <div class="col-sm form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="txtloinc"
          placeholder=""
          name="txtloinc"
          formControlName="txtloinc"
          title="{{ tooltips.txtloinc }}"
          [(ngModel)]="addData.loinc"
        />
        <label for="txtloinc">LOINC <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtloinc" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>
    <div class="row form-floating mb-3">
      <div class="col-sm form-floating mb-3" *ngIf="positiveCondition">
        <input
          type="text"
          class="form-control"
          id="txtPosCon"
          placeholder=""
          name="txtPosCon"
          formControlName="txtPosCon"
          title="{{ tooltips.txtPosCon }}"
          [(ngModel)]="addData.pos_condition"
        />
        <label for="txtPosCon">Positive Condition <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtPosCon" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>

      <div class="col-sm form-floating mb-3" *ngIf="negativeCondition">
        <input
          type="text"
          class="form-control"
          id="txtNegCon"
          placeholder=""
          name="txtNegCon"
          formControlName="txtNegCon"
          title="{{ tooltips.txtNegCon }}"
          [(ngModel)]="addData.neg_condition"
        />
        <label for="txtNegCon">Negative Condition <i class="bi bi-info-circle-fill field-info-icon" [ngbTooltip]="tooltips.txtNegCon" placement="top" container="body" tooltipClass="field-tooltip"></i></label>
      </div>
    </div>

    <div class="form-floating mb-3 text-center">
      <button
        type="submit"
        class="btn btn-primary btn-lg popup-save-btn"
        title="Save New Data"
      >
        Save
      </button>
      <button
        type="button"
        class="btn btn-outline-secondary btn-lg popup-cancel-btn ms-3"
        (click)="modal.close()"
        title="Cancel"
      >
        Cancel
      </button>
    </div>
  </div>
</form>
